name: Documentation
description: Something in the documentation is missing, wrong or unclear
title: "[Docs]: "
labels: ["type: documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: The file or page.
      placeholder: docs/providers.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
    validations:
      required: false
