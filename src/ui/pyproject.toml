[project]
name = "planner-ui"
version = "0.1.0"
description = "Resource Planner web interface"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "planner-client",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    # The interface languages: the .po catalogues are read at start-up, and dates, numbers and
    # the names of languages follow the CLDR data it ships.
    "babel>=2.16",
]

[tool.uv.sources]
planner-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_ui"]
artifacts = [
    "planner_ui/static/**",
    "planner_ui/locale/**",
]
