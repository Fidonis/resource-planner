<div class="space-y-4" aria-labelledby="modal-title">
  <h2 id="modal-title" class="font-brand text-lg font-bold">{{ secret.title }}</h2>
  <div role="alert" class="alert alert-warning text-sm">
    {{ icon("alert-triangle") }}
    <span>{{ secret.intro }}</span>
  </div>
  <div class="form-control">
    <label class="label-text mb-1 font-medium" for="secret-value">{{ secret.label }}</label>
    <div class="flex gap-2">
      <input id="secret-value" type="text" readonly value="{{ secret.value }}" class="input input-bordered w-full font-mono" autocomplete="off" spellcheck="false">
      <button type="button" class="btn btn-square" data-action="copy-secret" data-copy-from="secret-value" aria-label="{{ _('Copy') }}">{{ icon("copy") }}</button>
    </div>
  </div>
  <div class="modal-action">
    <button type="button" class="btn btn-primary" data-action="close-modal">{{ _("Done") }}</button>
  </div>
</div>
