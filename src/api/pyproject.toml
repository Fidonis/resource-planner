[project]
name = "planner-api"
version = "0.1.0"
description = "Resource Planner HTTP API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    # Cron schedule per integration. 3.x on purpose: every 4.x release is still a pre-release.
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.scripts]
planner-api = "planner_api.cli:main"

[project.entry-points."resource_planner.providers"]
csv-tasks = "planner_api.providers.csv_tasks:CsvTaskSource"
csv-absences = "planner_api.providers.csv_absences:CsvAbsenceSource"
csv-members = "planner_api.providers.csv_members:CsvDirectory"
keycloak = "planner_api.providers.keycloak:KeycloakDirectory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_api"]
