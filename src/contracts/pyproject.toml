[project]
name = "planner-client"
version = "0.1.0"
description = "Typed client for the Resource Planner HTTP API, generated from openapi.json"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_client"]
