# Reverse proxy of the development stack (docker-compose.dev.yml), and an example for the proxy you
# put in front of the planner: /api/, /openapi.json and /health/ go to the API, the rest to the web
# interface. Upstreams are resolved at request time, so the proxy starts even while a service is
# restarting. Behind your own proxy the upstreams are http://api:8000 and http://ui:8000 on the
# compose network, or the published ports on the host.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Large enough for a CSV import; the API checks the real limits.
    client_max_body_size 10m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # This proxy is the edge of the stack, so the address it sees is the client's; a value sent by
    # the client itself is dropped. Behind another proxy, use the real_ip module instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location = /openapi.json {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location /health/ {
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / {
        set $ui http://ui:8000;
        proxy_pass $ui;
    }
}
